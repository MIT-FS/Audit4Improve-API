# especificacion de detalle de log
# nivel de log global
.level = OFF
# javax.json.Json.level = FINEST
us.muit.fs.a4i.model.remote.GitHubRepositoryEnquirer.level = INFO
us.muit.fs.a4i.persistence.ExcelReportManager.level = FINEST
