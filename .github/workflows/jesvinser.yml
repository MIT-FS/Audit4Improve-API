name: Flujo de trabajo para andguicam

on: 
  workflow_dispatch: 
  issues: 
    types: [opened, edited] 

jobs: 
  Build: 
    runs-on: ubuntu-latest 
    env: 
      GITHUB_LOGIN: ${{ github.actor }} 
      GITHUB_PACKAGES: ${{ secrets.GITHUB_TOKEN }} 
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} 
    steps: 
      - name: Clonando el repositorio y estableciendo el espacio de trabajo 
        uses: actions/checkout@v3 

      - name: Configurando java 
        uses: actions/setup-java@v3 
        with: 
          distribution: 'temurin' 
          java-version: '16' 

      - name: Construyendo el código 
        run: | 
          chmod +x gradlew         
          ./gradlew assemble

      - name: Subiendo artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/libs/

  Test: 
    runs-on: ubuntu-latest 
    needs: Build 
    steps: 
      - name: Clonando el repositorio y estableciendo el espacio de trabajo 
        uses: actions/checkout@v3 

      - name: Configurando java 
        uses: actions/setup-java@v3 
        with: 
          distribution: 'temurin' 
          java-version: '16' 

      - name: Ejecutando los tests 
        run: | 
          chmod +x gradlew         
          ./gradlew test

